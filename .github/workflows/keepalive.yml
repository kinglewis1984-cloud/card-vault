name: Keep Supabase projects alive

# Supabase auto-pauses free-tier projects after 7 days with no API
# activity. This pings each project's own auth health endpoint directly
# (not just the website) twice a week, so the gap never gets close to 7
# days — covers both Card Vault and Football Fan Clubz.

on:
  schedule:
    - cron: '0 6 * * 1,4' # Monday and Thursday, 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # No -f here: these endpoints return 401 without an API key, which is
      # expected and still proves the project is alive and reachable. Without
      # -f, curl only exits non-zero on a real connection problem (e.g. DNS
      # not resolving, which is what happens when a project is actually
      # paused) - not on the expected 401.
      - name: Ping Card Vault Supabase
        run: curl -s -o /dev/null https://lgdmrdeievqojbqzzbnp.supabase.co/auth/v1/health

      - name: Ping Football Fan Clubz Supabase
        run: curl -s -o /dev/null https://hsccirgnwfwxccwjmgjf.supabase.co/auth/v1/health
