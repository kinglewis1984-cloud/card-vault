name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after 7 days with no API activity.
# This pings the REST API every ~5 days so Card Vault's database never
# goes to sleep. Uses the public anon/publishable key (safe to expose —
# it's already shipped in the built frontend), so no secrets needed.

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null -w "Supabase ping: HTTP %{http_code}\n" \
            "https://lgdmrdeievqojbqzzbnp.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_0PzgHSCK6kq66B2dx67Dgw_YmSEdsli" \
            -H "Authorization: Bearer sb_publishable_0PzgHSCK6kq66B2dx67Dgw_YmSEdsli"
